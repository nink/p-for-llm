<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PFor PLE-MoE model architecture</title>
  <desc id="desc">A decoder-only language model with token embeddings, twelve residual decoder layers containing grouped-query attention, Top-1 mixture-of-experts, and a per-layer PLE adapter, followed by a tied language-model head.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-ple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      .title { font: 700 52px Inter, Arial, sans-serif; fill: #17263A; letter-spacing: 0; }
      .subtitle { font: 400 24px Inter, Arial, sans-serif; fill: #5C6B7A; letter-spacing: 0; }
      .metric-value { font: 700 27px Inter, Arial, sans-serif; fill: #17263A; letter-spacing: 0; }
      .metric-label { font: 600 15px Inter, Arial, sans-serif; fill: #66768A; letter-spacing: 0.6px; }
      .section { font: 700 24px Inter, Arial, sans-serif; fill: #17263A; letter-spacing: 0; }
      .box-title { font: 700 22px Inter, Arial, sans-serif; fill: #17263A; letter-spacing: 0; }
      .box-copy { font: 500 18px Inter, Arial, sans-serif; fill: #526477; letter-spacing: 0; }
      .box-copy-small { font: 500 16px Inter, Arial, sans-serif; fill: #526477; letter-spacing: 0; }
      .label { font: 600 16px Inter, Arial, sans-serif; fill: #65758A; letter-spacing: 0; }
      .white-title { font: 700 20px Inter, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .white-copy { font: 500 15px Inter, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .center { text-anchor: middle; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .residual { fill: none; stroke: #94A3B8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-muted); }
      .ple-flow { fill: none; stroke: #0F766E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-ple); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="70" y="78" class="title">PFor model architecture</text>
  <text x="70" y="116" class="subtitle">Decoder-only PLE-MoE language model for ESP32-P4 inference</text>

  <g aria-label="Model summary">
    <rect x="70" y="150" width="330" height="82" rx="8" fill="#F8FAFC" stroke="#D8E0EA" stroke-width="2"/>
    <rect x="70" y="150" width="7" height="82" rx="3.5" fill="#17263A"/>
    <text x="98" y="186" class="metric-value">180.9M</text>
    <text x="98" y="214" class="metric-label">PARAMETERS</text>

    <rect x="420" y="150" width="330" height="82" rx="8" fill="#F8FAFC" stroke="#D8E0EA" stroke-width="2"/>
    <rect x="420" y="150" width="7" height="82" rx="3.5" fill="#2563EB"/>
    <text x="448" y="186" class="metric-value">12 layers</text>
    <text x="448" y="214" class="metric-label">DECODER STACK</text>

    <rect x="770" y="150" width="330" height="82" rx="8" fill="#F8FAFC" stroke="#D8E0EA" stroke-width="2"/>
    <rect x="770" y="150" width="7" height="82" rx="3.5" fill="#EA580C"/>
    <text x="798" y="186" class="metric-value">192</text>
    <text x="798" y="214" class="metric-label">MODEL WIDTH</text>

    <rect x="1120" y="150" width="330" height="82" rx="8" fill="#F8FAFC" stroke="#D8E0EA" stroke-width="2"/>
    <rect x="1120" y="150" width="7" height="82" rx="3.5" fill="#0F766E"/>
    <text x="1148" y="186" class="metric-value">1,024</text>
    <text x="1148" y="214" class="metric-label">CONTEXT LENGTH</text>

    <rect x="1470" y="150" width="380" height="82" rx="8" fill="#F8FAFC" stroke="#D8E0EA" stroke-width="2"/>
    <rect x="1470" y="150" width="7" height="82" rx="3.5" fill="#7C3AED"/>
    <text x="1498" y="186" class="metric-value">W1.58A8</text>
    <text x="1498" y="214" class="metric-label">BITLINEAR PROJECTIONS</text>
  </g>

  <text x="70" y="292" class="section">End-to-end token path</text>

  <g aria-label="Token input">
    <rect x="55" y="470" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#AEBCCB" stroke-width="2.5"/>
    <circle cx="92" cy="510" r="14" fill="#17263A"/>
    <rect x="116" y="498" width="52" height="24" rx="5" fill="#EEF2F6"/>
    <text x="130" y="552" class="box-title center">Token IDs</text>
    <text x="130" y="577" class="box-copy-small center">up to 1,024</text>

    <path d="M 205 530 H 242" class="flow"/>

    <rect x="250" y="448" width="195" height="164" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
    <rect x="273" y="477" width="34" height="34" rx="5" fill="#7C3AED"/>
    <path d="M 280 487 H 300 M 280 495 H 300 M 280 503 H 300" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="347.5" y="534" class="box-title center">Token</text>
    <text x="347.5" y="561" class="box-title center">embedding</text>
    <text x="347.5" y="591" class="box-copy-small center">32,768 x 192</text>
  </g>

  <g aria-label="Twelve decoder layers">
    <rect x="480" y="308" width="1030" height="430" rx="8" fill="#F8FAFC" stroke="#BCC8D6" stroke-width="2.5"/>
    <rect x="480" y="308" width="1030" height="58" rx="8" fill="#17263A"/>
    <path d="M 480 358 H 1510" stroke="#17263A" stroke-width="16"/>
    <text x="510" y="346" class="white-title">Decoder layer</text>
    <rect x="1329" y="322" width="151" height="31" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="1404.5" y="344" class="white-copy center">repeated 12x</text>

    <path d="M 445 530 H 520" class="flow"/>

    <rect x="520" y="438" width="230" height="184" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="635" y="478" class="box-title center">Causal GQA</text>
    <text x="635" y="509" class="box-copy center">RoPE</text>
    <line x1="555" y1="529" x2="715" y2="529" stroke="#BED3F9" stroke-width="2"/>
    <text x="635" y="557" class="box-copy-small center">6 Q heads / 2 KV heads</text>
    <text x="635" y="584" class="box-copy-small center">head dimension 32</text>
    <path d="M 750 530 H 772" class="flow"/>

    <circle cx="795" cy="530" r="21" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
    <path d="M 786 530 H 804 M 795 521 V 539" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 816 530 H 848" class="flow"/>

    <path d="M 500 530 V 397 H 795 V 507" class="residual"/>
    <text x="622" y="388" class="label center">residual</text>

    <rect x="855" y="408" width="315" height="244" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
    <text x="1012.5" y="447" class="box-title center">Top-1 MoE</text>

    <rect x="879" y="477" width="94" height="71" rx="6" fill="#F59E0B"/>
    <text x="926" y="505" class="white-title center">Router</text>
    <text x="926" y="531" class="white-copy center">192 -&gt; 29</text>
    <path d="M 973 512 H 1000" class="flow"/>
    <rect x="1007" y="466" width="139" height="93" rx="6" fill="#EA580C"/>
    <text x="1076.5" y="494" class="white-copy center">Selected</text>
    <text x="1076.5" y="518" class="white-title center">SwiGLU</text>
    <text x="1076.5" y="544" class="white-copy center">192 -&gt; 512 -&gt; 192</text>
    <text x="1012.5" y="595" class="box-copy center">1 of 29 experts active</text>
    <text x="1012.5" y="621" class="box-copy-small center">for each token</text>

    <path d="M 1170 530 H 1192" class="flow"/>
    <circle cx="1215" cy="530" r="21" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
    <path d="M 1206 530 H 1224 M 1215 521 V 539" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1236 530 H 1263" class="flow"/>

    <path d="M 828 530 V 382 H 1215 V 507" class="residual"/>

    <rect x="1270" y="438" width="190" height="184" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5"/>
    <text x="1365" y="478" class="box-title center">PLE adapter</text>
    <text x="1365" y="515" class="box-copy-small center">GELU gate x PLE</text>
    <line x1="1300" y1="536" x2="1430" y2="536" stroke="#A7E3DA" stroke-width="2"/>
    <text x="1365" y="569" class="box-copy center">176 -&gt; 192</text>
    <text x="1365" y="596" class="box-copy-small center">layer-specific input</text>

    <path d="M 1460 530 H 1472" class="flow"/>
    <circle cx="1490" cy="530" r="18" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
    <path d="M 1482 530 H 1498 M 1490 522 V 538" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 1248 530 V 397 H 1490 V 510" class="residual"/>
  </g>

  <g aria-label="Per-layer PLE generation">
    <path d="M 130 590 V 840 H 242" class="ple-flow"/>
    <path d="M 347 612 V 772" class="ple-flow"/>

    <rect x="250" y="780" width="340" height="150" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5"/>
    <text x="420" y="820" class="box-title center">Per-layer PLE</text>
    <text x="420" y="855" class="box-copy center">token-indexed table</text>
    <text x="420" y="882" class="box-copy center">+ embedding projection</text>
    <text x="420" y="913" class="box-copy-small center">12 layers x 176</text>

    <path d="M 590 855 H 1365 V 624" class="ple-flow"/>
    <rect x="787" y="834" width="263" height="35" rx="5" fill="#FFFFFF" stroke="#A7DCD5" stroke-width="1.5"/>
    <text x="918.5" y="857" class="label center" fill="#0F766E">layer i PLE (176)</text>
  </g>

  <g aria-label="Model output">
    <path d="M 1508 530 H 1542" class="flow"/>
    <rect x="1550" y="430" width="260" height="200" rx="8" fill="#F8FAFC" stroke="#17263A" stroke-width="2.5"/>
    <text x="1680" y="473" class="box-title center">Final RMSNorm</text>
    <path d="M 1680 490 V 516" class="flow"/>
    <text x="1680" y="553" class="box-title center">Tied LM head</text>
    <text x="1680" y="582" class="box-copy-small center">shares embedding weights</text>
    <path d="M 1810 530 H 1840" class="flow"/>

    <circle cx="1870" cy="530" r="30" fill="#17263A"/>
    <path d="M 1859 530 H 1880 M 1872 521 L 1881 530 L 1872 539" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1870" y="581" class="label center">logits</text>
  </g>

  <g aria-label="Legend">
    <line x1="670" y1="996" x2="720" y2="996" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="738" y="1002" class="label">token hidden state</text>
    <line x1="930" y1="996" x2="980" y2="996" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-ple)"/>
    <text x="998" y="1002" class="label">PLE side input</text>
    <line x1="1165" y1="996" x2="1215" y2="996" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
    <text x="1233" y="1002" class="label">residual connection</text>
  </g>
</svg>
